<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders - My Store</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>My Store</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    <a href="orders.html">Orders</a>
  </nav>

  <h2>Your orders</h2>
  <ul id="orders"></ul>

  <script src="store.js"></script>
  <script>
    var list = document.getElementById("orders");
    var orders = getOrders();
    if (!orders.length) list.textContent = "No orders yet.";

    // Dasenter tells server.js each order's status when it changes. Ask server.js for what it has heard.
    fetch(SERVER + "/dasenter/order-statuses")
      .then(function (r) { return r.json(); })
      .catch(function () { return {}; })
      .then(function (statuses) {
        orders.forEach(function (order) {
          var row = document.createElement("li");
          var title = document.createElement("h3");
          title.textContent = order.id + " - " + (statuses[order.id] || "sent to Dasenter");
          row.appendChild(title);
          var items = document.createElement("p");
          items.textContent = order.items.map(function (i) { return i.name + " x " + i.quantity; }).join(", ");
          row.appendChild(items);
          var total = document.createElement("p");
          total.className = "price";
          total.textContent = order.date + " - Total: " + order.total + " " + (order.currency || "");
          row.appendChild(total);
          list.appendChild(row);
        });
      });
  </script>
</body>
</html>
